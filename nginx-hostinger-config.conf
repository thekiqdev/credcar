# Configuração específica para Hostinger VPS
# Adicione estas linhas no arquivo /etc/nginx/sites-available/default

server {
    listen 80;
    server_name sistema.credcarmultimarcas.com.br;
    
    # CONFIGURAÇÕES PARA UPLOAD (ADICIONAR ESTAS LINHAS)
    client_max_body_size 15M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Configurações específicas para API de upload
    location /api/upload-document {
        client_max_body_size 15M;
        client_body_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/create-folder {
        client_max_body_size 15M;
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Suas outras configurações aqui...
    location / {
        try_files $uri $uri/ /index.html;
    }
}
