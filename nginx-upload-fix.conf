# Configuração do Nginx para uploads maiores
# Adicionar estas configurações no arquivo de configuração do Nginx

# Configurações para uploads
client_max_body_size 15M;
client_body_timeout 60s;
client_header_timeout 60s;

# Configurações específicas para a rota de upload
location /api/upload-document {
    client_max_body_size 15M;
    client_body_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_pass http://localhost:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Configurações para outras rotas da API
location /api/ {
    client_max_body_size 15M;
    proxy_pass http://localhost:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
